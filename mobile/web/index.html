<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gym_ai">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>gym_ai</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    video {
      object-fit: cover !important;
      width: 100% !important;
      height: 100% !important;
    }
    #gym-map-container {
      width: 100%;
      height: 100%;
      background: #0a0a0f;
    }
    /* Leaflet Dark Theme Overlays */
    .leaflet-tile { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
    .leaflet-container { background: #0a0a0f; }
    .gym-marker {
        background: #7000FF;
        border: 2px solid white;
        border-radius: 50%;
        color: white;
        text-align: center;
        font-weight: bold;
        box-shadow: 0 0 10px rgba(112, 0, 255, 0.6);
    }
  </style>
</head>
<body>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script>
    console.log("AI System: Loading global utilities...");
    
    let gymMap = null;
    let gymMarkers = [];

    window.initAndSyncMap = function(lat, lon, gymsJson) {
      console.log("Map Bridge: Syncing real-time gym data...");
      
      // Dynamic container search (Shadow DOM safe)
      let container = document.getElementById('web-map-container');
      if (!container) {
          // If not in main doc, search in all shadow roots (for Flutter Web)
          const allElements = document.querySelectorAll('*');
          for (let el of allElements) {
              if (el.shadowRoot) {
                  container = el.shadowRoot.getElementById('web-map-container');
                  if (container) break;
              }
          }
      }
      
      if (!container) {
          console.warn("Map Bridge: Container 'web-map-container' not found yet. Retrying in 500ms...");
          setTimeout(() => window.initAndSyncMap(lat, lon, gymsJson), 500);
          return;
      }

      // Initialize Leaflet if first time for this container
      if (!gymMap || gymMap.getContainer() !== container) {
        if (gymMap) gymMap.remove(); // Cleanup old instance
        
        console.log("Map Bridge: Initializing Leaflet Instance...");
        gymMap = L.map(container, { zoomControl: false }).setView([lat, lon], 14);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap'
        }).addTo(gymMap);
        
        // Fix Leaflet's missing icon bug on some bundles
        delete L.Icon.Default.prototype._getIconUrl;
        L.Icon.Default.mergeOptions({
          iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
          iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
          shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        });
      }

      // Refresh data
      const gyms = JSON.parse(gymsJson);
      gymMarkers.forEach(m => gymMap.removeLayer(m));
      gymMarkers = [];

      gymMap.setView([lat, lon], 14);
      
      // Mandatory for Flutter Web rendering
      setTimeout(() => { gymMap.invalidateSize(); }, 100);

      // User Position
      const userMarker = L.circleMarker([lat, lon], {
        radius: 10, fillColor: "#00FF00", color: "#fff", weight: 3, opacity: 1, fillOpacity: 0.8
      }).addTo(gymMap).bindPopup("<b>Your Location</b>");
      gymMarkers.push(userMarker);

      // Gym Pins
      gyms.forEach(gym => {
        const marker = L.marker([gym.lat, gym.lon], {
          icon: L.divIcon({
            className: 'gym-marker',
            html: '<div style="margin-top:2px; font-size:10px;">🏋️</div>',
            iconSize: [24, 24]
          })
        }).addTo(gymMap).bindPopup(`<b>${gym.name}</b><br><span style="font-size:10px">${gym.address}</span>`);
        gymMarkers.push(marker);
      });
    };
    
    // Persistent Pose instance
    let poseInstance = null;
    let detectionActive = false;
    let detectionCallback = null;

    function initAI() {
      if (poseInstance) return;
      console.log("AI System: Background Initializing Pose Detection...");
      
      poseInstance = new Pose({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
      }});
      
      poseInstance.setOptions({
        modelComplexity: 1, // Full Model for significantly better accuracy
        smoothLandmarks: true,
        minDetectionConfidence: 0.6, // Higher confidence for cleaner data
        minTrackingConfidence: 0.6
      });

      poseInstance.onResults((results) => {
        if (detectionActive && results.poseLandmarks && detectionCallback) {
          detectionCallback(JSON.stringify(results.poseLandmarks));
        }
      });

      let videoElement = null;
      let processing = false;

      async function findVideo() {
        const videos = document.getElementsByTagName('video');
        if (videos.length > 0) return videos[videos.length - 1];
        return document.querySelector('video');
      }

      async function processVideo() {
        if (!poseInstance) {
          requestAnimationFrame(processVideo);
          return;
        }
        
        // Re-find video if current one is disconnected or doesn't have metadata (stale)
        if (!videoElement || !videoElement.isConnected || videoElement.videoWidth === 0) {
          videoElement = await findVideo();
        }

        if (videoElement && videoElement.readyState >= 2 && videoElement.isConnected) {
          if (!processing && detectionActive) {
            processing = true;
            try {
              // Only call if we are still active (avoids ghost detections)
              if (detectionActive) await poseInstance.send({image: videoElement});
            } catch (e) {
              console.log("AI Scan Error: ", e);
            }
            processing = false;
          }
        }
        // Use a slightly longer delay on low-end devices or if inactive
        const delay = detectionActive ? 20 : 100;
        setTimeout(() => requestAnimationFrame(processVideo), delay);
      }
      processVideo();
    }

    // Start AI loading immediately
    initAI();

    window.speakFeedback = function(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.1;
      window.speechSynthesis.speak(utterance);
    };

    window.downloadFile = function(url, filename) {
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    window.startPoseDetection = function(callback) {
      console.log("AI System: Activating Detection...");
      detectionCallback = callback;
      detectionActive = true;
      initAI(); // Ensure it's ready
    };

    window.stopPoseDetection = function() {
      console.log("AI System: Deactivating Detection...");
      detectionActive = false;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
